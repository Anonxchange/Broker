<!DOCTYPE html>

<style>
:root{--bg:#F3F5FA;--ink:#0A1230;--mute:#62708F;--line:#D6DDEC;--brand:#1F4FFF;--side:#071A5A;--side-t:#A9B9EE;--up:#0B7F52;--dn:#C8344A;--wait:#9A6A00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-t);padding:26px 0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:21px;color:#fff;padding:0 24px 4px;letter-spacing:-.03em}.logo small{display:block;font-size:12px;font-weight:600;opacity:.6;letter-spacing:0}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.ov.d{justify-content:flex-end;padding:0}.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:24px;box-shadow:-20px 0 60px -20px rgba(0,0,0,.5)}

.sh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mute);background:color-mix(in srgb,var(--ink) 6%,transparent)}.opts button.on{background:var(--brand);color:#fff}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin:10px 0 0}

#login{min-height:100vh;display:grid;place-items:center;padding:20px}.lg{width:min(380px,100%)}.lg .logo{color:var(--ink);padding:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.drawer .tabs{margin:16px 0 0}.drawer .mini .btn{margin-left:auto}
.sx{position:absolute;top:18px;right:14px;display:none;color:#fff;border-color:rgba(255,255,255,.3)}
.scrim{position:fixed;inset:0;background:rgba(3,8,26,.55);z-index:30}
.app.col{grid-template-columns:minmax(0,1fr)}.app.col .side{display:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.chart{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:14px}.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.chart .bars i{width:36%;max-width:22px;border-radius:4px 4px 0 0;background:var(--up);min-height:2px}.chart .bars i.o{background:var(--brand)}.chart small{color:var(--mute);font-size:12px}
.hbar{display:grid;grid-template-columns:100px 1fr 90px;gap:12px;align-items:center;padding:8px 0;font-size:14px}.hbar i{display:block;height:8px;border-radius:4px;background:var(--brand)}.hbar span:last-child{text-align:right}
.chat{display:grid;gap:10px;margin:16px 0;max-height:320px;overflow:auto}.msg{max-width:85%;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,transparent)}.msg.me{justify-self:end;background:var(--brand);color:#fff}.msg small{display:block;opacity:.7;font-size:12px;margin-top:2px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;inset:0 auto 0 0;width:min(290px,84vw);z-index:40;transform:translateX(-100%);transition:transform .22s}.side.open{transform:none}.menu{display:grid}.sx{display:grid}.filters{grid-template-columns:1fr 1fr}.cols2{grid-template-columns:1fr!important}.filters input,.filters .btn{grid-column:1/-1}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.side,.btn{transition:none}}
</style>
</head>
<body>
<div id="login" hidden><div class="lg" id="lf"><div class="logo">Harbor Admin</div><p class="lbl" style="margin:0 0 6px">Sign in with an admin account.</p>
<label class="fl" for="le">Email</label><input class="sel" id="le" type="text" inputmode="email" value="admin@harbor.test" autocomplete="username">
<label class="fl" for="lp">Password</label><input class="sel" id="lp" type="password" value="admin" autocomplete="current-password">
<div class="err" id="lerr"></div><button class="btn" id="lgo" type="button" style="width:100%">Sign in</button><p class="note" style="font-size:13px">Prototype login is prefilled. Any email works with the password <b>admin</b>. Emails containing finance or support sign in with those limited roles. Replace <code>api.signIn</code> with Supabase Auth and check the admin role on the server.</p></div></div>
<div class="app" id="app" hidden>
<aside class="side" id="side"><button class="ic sx" data-a="sidex" aria-label="Close menu">&#10005;</button><div class="logo">Harbor<small>Admin console</small></div><div id="nav"></div></aside>
<div class="scrim" id="scrim" hidden></div>
<main class="main"><div class="top"><button class="ic menu" data-a="menu" aria-label="Open menu">&#9776;</button><b id="who"></b><button class="ic" data-a="theme" aria-label="Switch light or dark mode">&#9680;</button><button class="btn alt sm" data-a="logout">Sign out</button></div><div id="view"></div></main>
</div>
<div class="ov d" id="ovd" hidden><aside class="drawer" id="dw" role="dialog" aria-modal="true"></aside></div>
<div class="ov" id="ov" hidden></div>
<script>
/* HARBOR ADMIN (frontend only). Every change goes through the `api` object below, which currently works on sample data in localStorage.
   To connect Supabase, replace the body of each api method (see the "supabase:" comment on each) and keep the UI as is.
   Suggested tables: profiles(id,name,email,status,kyc,wd_allowed,role), ledger(id,user_id,type,amount_usd,note,admin_id,created_at),
   deposits, withdrawals, user_plans, plan_catalog, audit_log, platform_settings(key,value).
   IMPORTANT: this UI only hides buttons. Enforce admin-only access with RLS, and do balance changes in a SECURITY DEFINER Postgres function
   or edge function that checks the caller is an admin and writes the ledger and audit rows in one transaction. */
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),usd=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD"}),dt=t=>new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const KEY="harbor-admin-v1",hx=(n,s)=>"0x"+Array.from({length:n},(_,i)=>"0123456789abcdef"[(i*7+s*13+i*i*s)%16]).join("");
const KP={verified:"ok",pending:"wait",rejected:"bad",none:"mut"},SP={approved:"ok",pending:"wait",declined:"bad",active:"ok",paused:"wait",cancelled:"mut",suspended:"bad",hold:"wait",open:"wait",closed:"mut"};
function seed(){const n=Date.now(),H=36e5,U=(i,name,email,kyc,bal,st="active",wd=true)=>({id:"u"+i,name,email,kyc,bal,status:st,wd,joined:n-i*864e5*9,ledger:[]}),
D=(i,uid,asset,net,amt,v,status,h)=>({id:"D-"+(1000+i),uid,asset,net,amt,usd:v,tx:hx(64,i),status,t:n-h*H,note:""}),
W=(i,uid,asset,net,amt,v,status,h)=>({id:"W-"+(2000+i),uid,asset,net,amt,usd:v,to:hx(40,i+9),status,t:n-h*H,note:""}),
P=(i,uid,name,cls,amt,freq,status,ret)=>({id:"P-"+(3000+i),uid,name,cls,amt,freq,status,ret,t:n-i*864e5*3}),
TK=(i,uid,subject,status,h,m)=>({id:"T-"+(100+i),uid,subject,status,t:n-h*H,msgs:m.map((x,j)=>({from:x[0],text:x[1],t:n-h*H+j*6e4}))}),
C=(i,name,cls,risk,ret,min,freq)=>({id:"C-"+i,name,cls,risk,ret,min,freq,on:true});
return{users:[U(1,"Amara Okafor","amara@example.com","verified",5240.5),U(2,"Daniel Ruiz","daniel@example.com","verified",1280),U(3,"Mei Tanaka","mei@example.com","pending",300),U(4,"Lucas Meyer","lucas@example.com","verified",18750.25),U(5,"Sofia Rossi","sofia@example.com","rejected",0,"active",false),U(6,"Omar Haddad","omar@example.com","pending",75,"hold"),U(7,"Priya Nair","priya@example.com","verified",9420,"suspended",false),U(8,"Noah Smith","noah@example.com","none",0)],
deposits:[D(1,"u2","USDT","TRON (TRC20)",500,500,"pending",2),D(2,"u4","BTC","Bitcoin",.12,8100,"pending",5),D(3,"u1","USDC","Ethereum (ERC20)",1000,1000,"approved",30),D(4,"u3","ETH","Ethereum (ERC20)",.1,260,"pending",9),D(5,"u6","USDT","BNB Chain (BEP20)",75,75,"approved",50),D(6,"u8","SOL","Solana",2,300,"declined",70),D(7,"u1","USDT","TRON (TRC20)",800,800,"approved",96),D(8,"u4","ETH","Ethereum (ERC20)",1,2600,"approved",120),D(9,"u2","USDC","Ethereum (ERC20)",300,300,"approved",144)],
withdrawals:[W(1,"u1","USDT","TRON (TRC20)",250,251,"pending",3),W(2,"u4","ETH","Ethereum (ERC20)",.5,1300,"pending",6),W(3,"u2","USDC","Ethereum (ERC20)",100,100,"approved",40),W(4,"u5","USDT","BNB Chain (BEP20)",40,40,"pending",12),W(5,"u7","BTC","Bitcoin",.01,675,"declined",60),W(6,"u4","USDT","TRON (TRC20)",900,901,"approved",100),W(7,"u1","USDC","Ethereum (ERC20)",150,151,"approved",140)],
plans:[P(1,"u1","Blue-chip builder","Stocks",100,"Weekly","active","7\u20139%"),P(2,"u4","Crypto core","Crypto",500,"Weekly","active","12\u201320%"),P(3,"u4","Monthly rent","Real estate",1000,"Monthly","active","5\u20137%"),P(4,"u2","Index core","ETFs",50,"Monthly","paused","6\u20139%"),P(5,"u7","Treasury ladder","Bonds",2000,"Monthly","active","4\u20135%"),P(6,"u1","Gold shield","Commodities",75,"Monthly","active","3\u20136%")],
catalog:[C(1,"Blue-chip builder","Stocks",2,"7\u20139%",50,"Weekly"),C(2,"Index core","ETFs",1,"6\u20139%",25,"Weekly"),C(3,"Crypto core","Crypto",3,"12\u201320%",20,"Weekly"),C(4,"Monthly rent","Real estate",2,"5\u20137%",100,"Monthly"),C(5,"Treasury ladder","Bonds",1,"4\u20135%",100,"Monthly"),C(6,"Gold shield","Commodities",2,"3\u20136%",50,"Monthly")],
audit:[{t:n-5*H,admin:"system",act:"Seed",target:"-",detail:"Sample data loaded"}],
tickets:[TK(1,"u2","Deposit still pending","open",3,[["user","Hi, I sent 500 USDT two hours ago and it still shows pending."]]),TK(2,"u4","How do I save a withdrawal address?","open",20,[["user","Can I save a new address?"],["admin","You can add one after verification."],["user","Thanks, but I cannot find where."]]),TK(3,"u1","Pausing a plan","closed",90,[["user","Can I pause my weekly plan?"],["admin","Yes, it is paused now."]])],
announcements:[{id:"N-1",title:"Scheduled maintenance",body:"Withdrawals may be slower on Sunday between 02:00 and 04:00 UTC.",aud:"All users",on:true,t:n-30*H},{id:"N-2",title:"New plans available",body:"Explore the new Treasury ladder plan.",aud:"Verified users",on:false,t:n-200*H}],
team:[{id:"a1",email:"owner@harbor.test",role:"Owner",on:true},{id:"a2",email:"finance@harbor.test",role:"Finance",on:true},{id:"a3",email:"support@harbor.test",role:"Support",on:true}],
settings:{wdPaused:false,depPaused:false,maint:false,needKyc:true,wdFee:1,minWd:10,autoDep:0}}}
let DB,ME=null,view="Overview",UM="add",OPEN=null,UF={q:"",k:"all",s:"all"},FL={tk:"open",dep:"pending",wd:"pending",kyc:"pending",inv:"all",aud:""};
try{DB=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
DB=DB||seed();{const S0=seed();["tickets","announcements","team"].forEach(k=>{DB[k]=DB[k]||S0[k]})}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}},U=id=>DB.users.find(u=>u.id===id)||{name:"Deleted user",email:"",bal:0,ledger:[]},fail=m=>{throw new Error(m)};
const ROLES={Owner:["*"],Finance:["money"],Support:["kyc","support","announce"]},can=p=>{const L=ROLES[ME&&ME.role]||ROLES.Owner;return L.includes("*")||L.includes(p)},need=p=>{if(!can(p))fail("Your role ("+(ME&&ME.role||"Owner")+") cannot do this.")};
/* ---------------- API layer: swap each method for Supabase calls ---------------- */
const log=(act,target,detail)=>{DB.audit.unshift({t:Date.now(),admin:ME.email,act,target,detail})},led=(u,type,amt,note)=>u.ledger.unshift({t:Date.now(),type,amt,note,by:ME.email});
const api={
async signIn(e,p){/* supabase: supabase.auth.signInWithPassword, then read profiles.role==='admin' */if(p!=="admin")fail("Wrong email or password. Prototype password: admin");return{email:e,role:/finance/i.test(e)?"Finance":/support/i.test(e)?"Support":"Owner"}},
async createUser(f){need("users");/* supabase: edge function using the service role key: auth.admin.createUser + insert profile + opening ledger row */if(DB.users.some(u=>u.email===f.email))fail("That email already exists.");const u={id:"u"+Date.now(),name:f.name,email:f.email,kyc:f.kyc,bal:0,status:"active",wd:true,joined:Date.now(),ledger:[]};DB.users.unshift(u);if(+f.bal>0){u.bal=+f.bal;led(u,"add",+f.bal,"Opening balance")}log("User created",u.email,"Verification "+f.kyc+", opening balance "+usd(u.bal));save();return u},
async patchUser(id,patch,what){need("users");/* supabase: from('profiles').update(patch).eq('id',id) */const u=U(id);Object.assign(u,patch);log(what,u.email,JSON.stringify(patch));save()},
async adjust(id,mode,amt,why){need("money");/* supabase: rpc('admin_adjust_balance',{user_id,mode,amount,reason}) */const u=U(id),b=u.bal,nb=mode==="add"?b+amt:mode==="sub"?b-amt:amt;if(nb<0)fail("Balance cannot go below zero.");u.bal=Math.round(nb*100)/100;led(u,mode,amt,why);log("Balance "+mode,u.email,usd(b)+" to "+usd(u.bal)+". "+why);save()},
async setKyc(id,s,note){need("kyc");/* supabase: update profiles set kyc=... */const u=U(id);u.kyc=s;log("Verification "+s,u.email,note||"");save()},

async decideWd(id,ok,note){need("money");/* supabase: rpc('admin_decide_withdrawal',{id,approve,note}) */const w=DB.withdrawals.find(x=>x.id===id);if(w.status!=="pending")fail("Already decided.");if(ok&&DB.settings.wdPaused)fail("Withdrawals are paused.");if(ok&&U(w.uid).status!=="active")fail("This account is on hold or suspended.");w.status=ok?"approved":"declined";w.note=note;if(!ok){const u=U(w.uid);u.bal+=w.usd;led(u,"refund",w.usd,"Withdrawal "+w.id+" declined")}log("Withdrawal "+w.status,w.id,usd(w.usd)+" "+U(w.uid).email+". "+note);save()},
