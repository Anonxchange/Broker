kind = "web"
previewPath = "/"
title = "Auvrenthia Markets"
description = "A multi-asset investment website where visitors can explore market categories and product information, then create an account or sign in to continue."
version = "1.0.0"
id = "artifacts/wealthhub-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22188

[services.development]
run = "pnpm --filter @workspace/wealthhub-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wealthhub-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/wealthhub-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22188"
BASE_PATH = "/"
